name: Release plugin

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.js && node tests/hooks.test.js
      - name: Package plugin
        run: |
          cd plugins
          zip -r ../github-dev-toolkit-${GITHUB_REF_NAME}.zip github-dev-toolkit
      - uses: softprops/action-gh-release@v2
        with:
          files: github-dev-toolkit-*.zip
          generate_release_notes: true
